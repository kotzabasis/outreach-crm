name: Keep Render backend awake

# Render's free web-service tier spins the whole process down after 15
# minutes without an incoming HTTP request — which also kills the in-process
# campaign/sequence schedulers (backend/src/lib/scheduler.js) until the next
# request wakes it back up, so scheduled sends can silently stall for hours.
# Pinging /health keeps the instance awake, for free, using GitHub Actions'
# own scheduler — no paid Render Cron Job needed.
#
# Cadence: every 5 minutes, not 10. GitHub's own docs say scheduled workflows
# "may be delayed during periods of high loads" with no upper bound promised —
# real cold-start 404s hit during testing were traced back to exactly this: a
# missed/late tick let the 10-minute gap slip past Render's 15-minute
# spin-down window. Halving the interval buys a much bigger buffer against
# scheduler drift for the same reason a smoke detector needs margin, not just
# the bare minimum.
#
# Cost check: ~5-minute cadence is ~8,600 pings/month, comfortably within
# Render's 750 free instance-hours/month (an always-on single service uses
# ~720-744 hours/month, i.e. nearly all of that budget — fine as long as this
# is the only free Render service on the account). Separately, if this repo
# is PRIVATE (not public), each run also burns GitHub Actions minutes against
# your account's monthly free quota (2,000 min/month on GitHub Free) — a
# ~5-10s curl step still typically bills as 1 rounded-up minute per run, so
# ~8,600 runs/month could alone exceed that quota and start costing money.
# If the repo is private and that's a concern, either switch back to */10,
# or move the ping to a cheaper mechanism (e.g. an external free uptime
# monitor like UptimeRobot/cron-job.org hitting /health instead).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # allows a manual "Run workflow" click from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        run: |
          curl -fsS --max-time 20 "https://outreach-crm-a22j.onrender.com/health" || echo "Ping failed (backend may be cold-starting) — not failing the job."
